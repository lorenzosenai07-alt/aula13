<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenis Mania | Login</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header>
    <h1>Entrar na conta</h1>
    <nav><a href="../index.html">Home</a></nav>
  </header>

  <main class="formulario">
    <img class="imagem-form" src="https://placehold.co/300x150?text=Bem-vindo" alt="Ilustração de boas-vindas">
    <h2>Faça login</h2>
    <form action="login.html" method="get">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required>

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required>

      <button type="submit">Entrar</button>
    </form>
    <p><a href="esqueci-senha.html">Esqueci minha senha</a></p>
    <p>Não tem cadastro? <a href="cadastro.html">Cadastre-se</a></p>
  </main>

  <footer><p>&copy; 2026 Tenis Mania</p></footer>
</body>
</html>
