<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenis Mania | Recuperar senha</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header>
    <h1>Recuperar senha</h1>
    <nav><a href="login.html">Voltar ao login</a></nav>
  </header>

  <main class="formulario">
    <img class="imagem-form" src="https://placehold.co/300x150?text=Recuperar+Senha" alt="Ilustração de recuperação de senha">
    <h2>Esqueceu sua senha?</h2>
    <p>Digite o e-mail cadastrado. Você poderá seguir as instruções para recuperar o acesso.</p>
    <form action="login.html" method="get">
      <label for="email">E-mail cadastrado</label>
      <input id="email" name="email" type="email" required>
      <button type="submit">Enviar</button>
    </form>
  </main>

  <footer><p>&copy; 2026 Tenis Mania</p></footer>
</body>
</html>
