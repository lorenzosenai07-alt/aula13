<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenis Mania | Cadastro</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header>
    <h1>Criar cadastro</h1>
    <nav>
      <a href="../index.html">Home</a>
      <a href="login.html">Entrar</a>
    </nav>
  </header>

  <main class="formulario">
    <h2>Preencha seus dados</h2>
    <form action="login.html" method="get">
      <label for="nome">Nome completo</label>
      <input id="nome" name="nome" type="text" autocomplete="name" required>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required>

      <label for="confirmar">Confirmar senha</label>
      <input id="confirmar" name="confirmar" type="password" required>

      <label for="rg">RG</label>
      <input id="rg" name="rg" type="text" required>

      <label for="cpf">CPF</label>
      <input id="cpf" name="cpf" type="text" required>

      <label for="endereco">Endereço</label>
      <input id="endereco" name="endereco" type="text" autocomplete="street-address" required>

      <label for="cep">CEP</label>
      <input id="cep" name="cep" type="text" autocomplete="postal-code" required>

      <label for="cidade">Cidade</label>
      <input id="cidade" name="cidade" type="text" autocomplete="address-level2" required>

      <label for="estado">Estado</label>
      <input id="estado" name="estado" type="text" autocomplete="address-level1" required>

      <label for="pais">País</label>
      <input id="pais" name="pais" type="text" value="Brasil" autocomplete="country-name" required>

      <label for="nascimento">Data de nascimento</label>
      <input id="nascimento" name="nascimento" type="date" required>

      <button type="submit">Cadastrar</button>
    </form>
    <p>Já tem conta? <a href="login.html">Faça login</a></p>
  </main>

  <footer><p>&copy; 2026 Tenis Mania</p></footer>
</body>
</html>
